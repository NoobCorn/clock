<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent: #ffffff;
            --gradient-1: #ffffff;
            --gradient-2: #ffffff;
        }

        body {
            width: 100%;
            height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
        }

        body.gradient-on {
            background: linear-gradient(135deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
            animation: gradientShift 15s ease infinite;
        }

        body.gradient-diagonal {
            background: linear-gradient(45deg, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        body.gradient-radial {
            background: radial-gradient(circle, var(--gradient-1) 0%, var(--gradient-2) 100%);
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(10deg); }
        }

        body.gradient-movement-off {
            animation: none !important;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .clock-display {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        /* ===== Base Time Display ===== */
        .time {
            font-size: 12vw;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
            margin: 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* ===== Clock Styles ===== */
        /* 1. Minimal */
        .clock-display.style-minimal .time {
            font-size: 10vw;
            font-weight: 200;
            letter-spacing: 0.02em;
        }

        /* 2. Large Centered */
        .clock-display.style-large .time {
            font-size: 17vw;
            font-weight: 700;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            line-height: 0.9;
        }

        /* 3. Flip Clock */
        .clock-display.style-flip .time {
            display: inline-flex;
            align-items: center;
            gap: 1.5vw;
            font-size: 8.5vw;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
        }

        .flip-card {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0.15em 0.28em;
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.15);
            position: relative;
            backdrop-filter: blur(10px);
            perspective: 800px;
            min-width: 1.8em;
            text-align: center;
        }

        .flip-card .fc-val {
            position: relative;
            z-index: 1;
        }

        .flip-card::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: rgba(0, 0, 0, 0.25);
            z-index: 10;
        }

        .flipper {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: flip-card-anim 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            z-index: 15;
        }

        .fc-front, .fc-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 0.15em 0.28em;
            backdrop-filter: blur(10px);
        }

        .fc-back {
            transform: rotateX(180deg);
            background: rgba(255,255,255,0.05);
        }

        @keyframes flip-card-anim {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-180deg); }
        }

        .flip-sep {
            opacity: 0.5;
            font-weight: 300;
        }
        
        .flip-ampm {
            font-size: 0.35em;
            margin-left: 0.4vw;
            font-weight: 500;
        }

        /* 4. Word Clock */
        .clock-display.style-word .time {
            font-size: 5.5vw;
            font-weight: 600;
            line-height: 1.25;
            max-width: 80vw;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .date {
            font-size: 1.5vw;
            color: var(--text-secondary);
            margin-top: 2vw;
            letter-spacing: 0.05em;
            font-weight: 400;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        /* ===== Time Progress Indicators ===== */
        .time-progress-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: clamp(200px, 24vw, 320px);
            margin: 2vw auto 0;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .time-progress-container:empty {
            display: none;
        }

        .progress-item {
            display: none;
            flex-direction: column;
            gap: 4px;
        }

        .progress-item.active {
            display: flex;
        }

        .progress-label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .progress-value {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            color: var(--text-primary);
            opacity: 0.8;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            border-radius: 2px;
            background: var(--bg-secondary);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            background: var(--accent);
            opacity: 0.75;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .controls {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 3vmin;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
        }

        .controls.visible {
            opacity: 1;
        }

        .controls .left-controls,
        .controls .settings-btn {
            pointer-events: none;
        }

        .controls.visible .left-controls,
        .controls.visible .settings-btn {
            pointer-events: auto;
        }

        .left-controls {
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .tasks-btn {
            height: 50px;
            padding: 0 18px 0 14px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .tasks-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
        }

        .tasks-btn svg {
            flex-shrink: 0;
        }

        .mode-controls {
            position: fixed;
            bottom: 3vmin;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 50;
        }

        .mode-btn {
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: rgba(10, 10, 14, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            overflow-y: auto;
            padding: 24px;
        }

        .settings-panel.open {
            transform: translateX(0);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .settings-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .close-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .settings-section {
            margin-bottom: 32px;
        }

        .settings-section h3 {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .settings-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .theme-preview {
            aspect-ratio: 1;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .theme-preview:hover {
            transform: scale(1.05);
        }

        .theme-preview.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .font-preview {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 14px;
            text-align: center;
        }

        .font-preview:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .font-preview.active {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .toggle {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            padding: 0;
        }

        .toggle.on {
            background: var(--accent);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.2s ease;
        }

        .toggle.on::after {
            left: 24px;
        }

        .toggle-label {
            color: var(--text-primary);
            font-size: 14px;
        }

        .select-group {
            margin-bottom: 12px;
        }

        .select-label {
            display: block;
            color: var(--text-primary);
            font-size: 14px;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.2);
        }

        select option {
            background: #1a1a1a;
            color: white;
        }

        .alarm-sound-row {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .alarm-sound-row select {
            flex: 1;
        }

        .preview-sound-btn {
            width: 44px;
            flex-shrink: 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .preview-sound-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .timer-input {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Timer Display */
        .timer-display {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 1.5vh, 16px);
            z-index: 10;
        }

        .timer-display.active {
            display: flex;
        }

        .timer-ring-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 340px;
            height: 340px;
        }

        .timer-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .ring-bg {
            fill: none;
            stroke: var(--text-secondary);
            opacity: 0.25;
            stroke-width: 2;
        }

        .ring-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 3;
            stroke-linecap: round;
            transition: opacity 0.3s ease;
        }

        .ring-progress.alarm-pulse {
            animation: ringPulse 1s ease-in-out infinite;
        }

        @keyframes ringPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .timer-units-col {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: max-content;
            transition: transform 0.2s ease;
        }

        .timer-units {
            display: flex;
            align-items: center;
            gap: clamp(2px, 0.4vw, 8px);
        }

        .timer-unit {
            display: flex;
            align-items: center;
            gap: clamp(1px, 0.2vw, 4px);
        }

        .unit-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(4px, 0.4vw, 8px);
        }

        .unit-value {
            font-family: inherit;
            font-size: clamp(40px, 7vw, 84px);
            font-weight: 300;
            color: var(--text-primary);
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            width: 2ch;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            padding: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .unit-value::-webkit-outer-spin-button,
        .unit-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .unit-value:focus {
            color: var(--accent);
        }

        .unit-label {
            font-size: clamp(11px, 0.9vw, 14px);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .unit-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: clamp(18px, 1.8vw, 24px);
            cursor: pointer;
            width: clamp(26px, 2vw, 34px);
            height: clamp(26px, 2vw, 34px);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s ease, color 0.2s ease;
            line-height: 1;
            font-family: inherit;
        }

        .unit-btn:hover:not(:disabled) {
            opacity: 1;
            color: var(--text-primary);
        }

        .unit-btn:disabled {
            opacity: 0.15;
            cursor: not-allowed;
        }

        .timer-colon {
            display: flex;
            flex-direction: column;
            gap: clamp(3px, 0.4vw, 6px);
            padding-bottom: clamp(12px, 1.2vw, 18px);
        }

        .timer-colon span {
            width: clamp(6px, 0.5vw, 8px);
            height: clamp(6px, 0.5vw, 8px);
            border-radius: 50%;
            background: var(--text-primary);
            opacity: 0.8;
        }

        .timer-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 10;
        }

        .timer-alarm-banner {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 13px;
            letter-spacing: 0.03em;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .timer-alarm-banner.active {
            display: flex;
        }

        .timer-sound-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px 6px 14px;
            border-radius: 22px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .timer-sound-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .timer-sound-select {
            appearance: none;
            -webkit-appearance: none;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 4px;
            cursor: pointer;
            max-width: 40vw;
        }

        .timer-sound-select:focus {
            outline: none;
        }

        .timer-sound-select option {
            background: #1a1a1a;
            color: white;
        }

        .timer-sound-preview-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .timer-sound-preview-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .timer-sound-preview-btn:active {
            transform: scale(0.92);
        }

        .timer-icon-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, background 0.2s ease, filter 0.2s ease;
        }

        .timer-icon-btn:active {
            transform: scale(0.94);
        }

        .timer-icon-btn.reset {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--text-primary);
            backdrop-filter: blur(10px);
        }

        .timer-icon-btn.reset:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .timer-icon-btn.play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--bg-primary);
        }

        .timer-icon-btn.play:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .timer-icon-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .time-input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .time-input-group label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .time-input-group input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            text-align: center;
        }

        .time-input-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
